<!-- Site logo -->

<!--
  The wordmark is inlined rather than loaded through `config.theme.logo` so its
  color can be driven by CSS. An <img> would isolate the SVG from the page and
  leave the hardcoded fill in place when the palette switches to `slate`.
-->

<style>
    .md-header__logo {
        display: flex;
        align-items: center;
        flex-shrink: 0;
    }

    .md-header__logo :is(img, svg) {
        display: block;
        height: 1.7rem;
        width: auto;
    }

    /* Wordmark inherits the header text color so it flips with the palette */
    .md-header__logo .keystone-logo {
        color: #001950;
    }

    [data-md-color-scheme="slate"] .md-header__logo .keystone-logo {
        color: #ffffff;
    }

    [data-md-color-scheme="slate"] .md-header__logo .keystone-logo__rule {
        fill: #6f9bff;
    }
</style>
